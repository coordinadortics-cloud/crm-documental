<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Iniciar Sesión
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{

            background: linear-gradient(
                135deg,
                #0d1b2a,
                #1b263b
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            padding: 20px;
        }

        .login-card{

            width: 100%;
            max-width: 420px;

            border: none;

            border-radius: 20px;

            overflow: hidden;

            background: white;
        }

        .login-header{

            background: #212529;

            color: white;

            text-align: center;

            padding: 30px;
        }

        .login-header i{

            font-size: 50px;

            margin-bottom: 15px;
        }

        .login-body{

            padding: 35px;
        }

        .form-control{

            border-radius: 12px;

            padding: 12px;
        }

        .btn-login{

            background: #212529;

            color: white;

            border-radius: 12px;

            padding: 12px;

            font-weight: bold;

            width: 100%;

            border: none;

            transition: 0.3s;
        }

        .btn-login:hover{

            background: #343a40;
        }

        @media(max-width: 576px){

            .login-body{

                padding: 25px;
            }

            .login-header{

                padding: 25px;
            }

        }

    </style>

</head>

<body>

<div class="card login-card shadow-lg">

    <div class="login-header">

        <i class="fa fa-folder-open"></i>

        <h3>

            Gestión Documental

        </h3>

        <p class="mb-0">

            Inicio de Sesión

        </p>

    </div>

    <div class="login-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label fw-bold">

                    Usuario

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label fw-bold">

                    Contraseña

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-login">

                <i class="fa fa-right-to-bracket"></i>

                Ingresar

            </button>

        </form>

    </div>

</div>

</body>

</html>
