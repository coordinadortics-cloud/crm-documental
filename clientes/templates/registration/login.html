<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card{
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }

        .login-header{
            background: #212529;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .login-body{
            padding: 35px;
            background: white;
        }

        .form-control{
            height: 50px;
            border-radius: 10px;
        }

        .btn-login{
            height: 50px;
            border-radius: 10px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="card shadow login-card">

    <div class="login-header">

        <h2>
            Documentos Cartera
        </h2>

        <p class="mb-0">
            Inicio de sesión
        </p>

    </div>

    <div class="login-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-dark w-100 btn-login">

                <i class="fa fa-lock"></i>
                Ingresar

            </button>

        </form>

    </div>

</div>

</body>

</html>
