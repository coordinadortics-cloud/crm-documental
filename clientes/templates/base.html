<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Gestión Documental
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .sidebar{
            width: 250px;
            height: 100vh;
            position: fixed;
            background: #212529;
            top: 0;
            left: 0;
            padding-top: 20px;
            transition: 0.3s;
            z-index: 1000;
        }

        .sidebar a{
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            transition: 0.3s;
        }

        .sidebar a:hover{
            background: #343a40;
        }

        .content{
            margin-left: 260px;
            padding: 30px;
            transition: 0.3s;
        }

        .card{
            border-radius: 15px;
        }

        .table thead{
            background: #212529;
            color: white;
        }

        .topbar{
            display: none;
        }

        @media(max-width: 768px){

            .sidebar{
                left: -250px;
            }

            .sidebar.active{
                left: 0;
            }

            .content{
                margin-left: 0;
                padding: 15px;
            }

            .topbar{
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #212529;
                color: white;
                padding: 15px;
            }

        }

    </style>

</head>

<body>

<div class="topbar">

    <button class="btn btn-light" onclick="toggleSidebar()">

        <i class="fa fa-bars"></i>

    </button>

    <h5 class="m-0">
        CRM
    </h5>

</div>

<div class="sidebar" id="sidebar">

    <h3 class="text-white text-center mb-4">
        Gestión Documental
    </h3>

    <a href="{% url 'lista_clientes' %}">
        <i class="fa fa-users"></i>
        Clientes
    </a>

    <a href="{% url 'crear_cliente' %}">
        <i class="fa fa-user-plus"></i>
        Nuevo Cliente
    </a>

    <a href="{% url 'subir_documento' %}">
        <i class="fa fa-file-upload"></i>
        Subir Documento
    </a>

    <a href="{% url 'lista_asesores' %}">
        <i class="fa fa-user-tie"></i>
        Asesores
    </a>

    <a href="{% url 'exportar_excel' %}">
        <i class="fa fa-file-excel"></i>
        Exportar Excel
    </a>

    <a href="{% url 'logout' %}">
        <i class="fa fa-sign-out-alt"></i>
        Cerrar Sesión
    </a>

</div>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

<script>

function toggleSidebar(){

    document.getElementById('sidebar').classList.toggle('active');

}

</script>

</body>

</html>
