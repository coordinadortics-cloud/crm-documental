<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Panel Auditoría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .sidebar{
            width: 250px;
            height: 100vh;
            position: fixed;
            background: #212529;
            padding-top: 20px;
        }

        .sidebar a{
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            transition: 0.3s;
        }

        .sidebar a:hover{
            background: #343a40;
        }

        .content{
            margin-left: 260px;
            padding: 30px;
        }

        .card{
            border-radius: 15px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3 class="text-white text-center mb-4">
        Gestión Documental
    </h3>

    <a href="{% url 'lista_clientes' %}">
        <i class="fa fa-users"></i>
        Clientes
    </a>

    <a href="{% url 'panel_auditoria' %}">
        <i class="fa fa-shield-halved"></i>
        Auditoría
    </a>

    <a href="{% url 'logout' %}">
        <i class="fa fa-right-from-bracket"></i>
        Cerrar Sesión
    </a>

</div>

<div class="content">

    <div class="card shadow border-0">

        <div class="card-body">

            <div class="d-flex justify-content-between mb-4">

                <div>

                    <h2>
                        Panel de Auditoría
                    </h2>

                    <p class="text-muted">
                        Historial de acciones realizadas por usuarios
                    </p>

                </div>

            </div>

            <form method="GET" class="mb-4">

                <div class="row">

                    <div class="col-md-10">

                        <input
                            type="text"
                            name="busqueda"
                            class="form-control"
                            placeholder="Buscar acción...">

                    </div>

                    <div class="col-md-2">

                        <button
                            class="btn btn-dark w-100"
                            type="submit">

                            Buscar

                        </button>

                    </div>

                </div>

            </form>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Usuario</th>
                            <th>Acción</th>
                            <th>Fecha</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for auditoria in auditorias %}

                        <tr>

                            <td>

                                <span class="badge bg-dark">

                                    {{ auditoria.usuario.username }}

                                </span>

                            </td>

                            <td>

                                {{ auditoria.accion }}

                            </td>

                            <td>

                                {{ auditoria.fecha }}

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
