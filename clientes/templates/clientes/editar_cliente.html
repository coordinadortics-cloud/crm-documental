<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card{
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header{
            background: linear-gradient(135deg, #8b5e00, #d4a017);
            padding: 25px;
        }

        .card-header h3{
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
            color: white;
        }

        .card-body{
            padding: 35px;
        }

        .form-control{
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ced4da;
        }

        .form-control:focus{
            border-color: #d4a017;
            box-shadow: 0 0 0 0.15rem rgba(212,160,23,0.25);
        }

        label{
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .btn-success{
            background: #d4a017;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 500;
            color: white;
        }

        .btn-success:hover{
            background: #8b5e00;
        }

        .btn-outline-secondary{
            border-radius: 10px;
            padding: 10px 25px;
        }

        .container{
            max-width: 750px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header">

            <h3>Actualizar Información del Cliente</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-4 d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Actualizar Cliente

                    </button>

                    <a href="/"
                       class="btn btn-outline-secondary">

                       Volver

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
