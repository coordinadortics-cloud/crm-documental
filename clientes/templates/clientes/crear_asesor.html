<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registro de Asesor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card{
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header{
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            padding: 25px;
        }

        .card-header h3{
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-control{
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ced4da;
        }

        .form-control:focus{
            border-color: #1b263b;
            box-shadow: 0 0 0 0.15rem rgba(27,38,59,0.25);
        }

        .btn-success{
            background: #1b263b;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-success:hover{
            background: #0d1b2a;
        }

        .btn-secondary{
            border-radius: 10px;
            padding: 10px 25px;
        }

        .container{
            max-width: 700px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header text-white">

            <h3>Registro de Nuevo Asesor</h3>

        </div>

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-4 d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Guardar Registro

                    </button>

                    <a href="{% url 'lista_asesores' %}"
                       class="btn btn-outline-secondary">

                       Volver

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html> este es el codigo modificalo
