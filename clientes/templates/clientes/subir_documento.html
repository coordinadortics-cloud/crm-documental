{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9 col-12">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-dark text-white p-4">

                    <h3 class="mb-0">

                        <i class="fa fa-file-upload"></i>

                        Gestión de Documentos

                    </h3>

                </div>

                <div class="card-body p-4">

                    <form
                        method="POST"
                        enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- =========================
                             CLIENTE
                        ========================= -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Cliente

                            </label>

                            {{ form.cliente }}

                        </div>

                        <!-- =========================
                             TIPO DOCUMENTO
                        ========================= -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Tipo de Documento

                            </label>

                            {{ form.tipo }}

                        </div>

                        <!-- =========================
                             NOMBRE PERSONALIZADO
                        ========================= -->

                        <div
                            class="mb-4"
                            id="campo_otro"
                            style="display:none;">

                            <label class="form-label fw-bold">

                                Nombre Personalizado del Documento

                            </label>

                            {{ form.nombre_personalizado }}

                        </div>

                        <!-- =========================
                             ARCHIVO
                        ========================= -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Archivo

                            </label>

                            {{ form.archivo }}

                        </div>

                        <!-- =========================
                             BOTONES
                        ========================= -->

                        <div class="d-flex flex-wrap gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-dark">

                                <i class="fa fa-save"></i>

                                Guardar Documento

                            </button>

                            <a href="{% url 'lista_clientes' %}"
                               class="btn btn-outline-secondary">

                                <i class="fa fa-arrow-left"></i>

                                Volver

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    // =========================
    // MOSTRAR CAMPO OTRO
    // =========================

    const tipoDocumento =
        document.getElementById('id_tipo');

    const campoOtro =
        document.getElementById('campo_otro');

    function validarOtro() {

        if (tipoDocumento.value === 'otro') {

            campoOtro.style.display = 'block';

        } else {

            campoOtro.style.display = 'none';

        }
    }

    tipoDocumento.addEventListener(
        'change',
        validarOtro
    );

    validarOtro();

    // =========================
    // BLOQUEAR CAMPOS
    // SI VIENEN POR URL
    // =========================

    const url =
        new URLSearchParams(window.location.search);

    const cliente =
        url.get('cliente');

    const tipo =
        url.get('tipo');

    if (cliente) {

        document.getElementById('id_cliente')
            .setAttribute('readonly', true);

        document.getElementById('id_cliente')
            .style.pointerEvents = 'none';

        document.getElementById('id_cliente')
            .style.background = '#e9ecef';
    }

    if (tipo) {

        document.getElementById('id_tipo')
            .setAttribute('readonly', true);

        document.getElementById('id_tipo')
            .style.pointerEvents = 'none';

        document.getElementById('id_tipo')
            .style.background = '#e9ecef';
    }

</script>

{% endblock %}
