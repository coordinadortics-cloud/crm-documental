<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Subir Documento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card{
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }

        .card-header{
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            padding: 25px;
        }

        .card-header h3{
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .card-body{
            padding: 35px;
        }

        label{
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-control,
        .form-select{
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ced4da;
        }

        .form-control:focus,
        .form-select:focus{
            border-color: #1b263b;
            box-shadow: 0 0 0 0.15rem rgba(27,38,59,0.25);
        }

        .btn-success{
            background: #1b263b;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            font-weight: 500;
        }

        .btn-success:hover{
            background: #0d1b2a;
        }

        .btn-outline-secondary{
            border-radius: 10px;
            padding: 10px 25px;
        }

        .container{
            max-width: 750px;
        }

        #campo_otro{
            transition: all 0.3s ease;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header text-white">

            <h3>Gestión de Documentos</h3>

        </div>

        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-4">

                    <label class="form-label">
                        Cliente
                    </label>

                    {{ form.cliente }}

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Tipo de Documento
                    </label>

                    {{ form.tipo }}

                </div>

                <div
                    class="mb-4"
                    id="campo_otro"
                    style="display:none;">

                    <label class="form-label">

                        Nombre Personalizado del Documento

                    </label>

                    {{ form.nombre_personalizado }}

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Archivo
                    </label>

                    {{ form.archivo }}

                </div>

                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Guardar Documento

                    </button>

                    <a href="/"
                       class="btn btn-outline-secondary">

                       Volver

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

    const tipoDocumento =
        document.getElementById('id_tipo');

    const campoOtro =
        document.getElementById('campo_otro');

    function validarOtro() {

        if (tipoDocumento.value === 'otro') {

            campoOtro.style.display = 'block';

        } else {

            campoOtro.style.display = 'none';

        }
    }

    tipoDocumento.addEventListener(
        'change',
        validarOtro
    );

    validarOtro();

</script>

</body>
</html>
